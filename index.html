<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Navroop, Will You Be My Valentine? 💝</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<!-- Tailwind CDN -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Confetti CDN -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
/* --- General Styles --- */
body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(180deg, #ffd0e5 0%, #ffe8f2 36%, #ffffff 100%);
    overflow-x: hidden;
    position: relative;
}
.container {
    max-width: 600px;
    margin: 0 auto;
    text-align: center;
    padding: 20px;
}
h1, h2 {
    font-family: 'Dancing Script', cursive;
    color: #bd1e59;
}
.hidden { display: none; }

/* --- Buttons --- */
.cute-btn {
    background-color: #fd5c7d;
    color: white;
    padding: 12px 20px;
    margin: 10px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 18px;
    transition: all 0.3s ease;
    position: relative;
}
.cute-btn:hover {
    background-color: #ff7aa6;
}
.final-yes {
    background-color: #4ade80;
}
.final-yes:hover {
    background-color: #22c55e;
}

/* --- Music Controls --- */
.music-controls {
    margin: 15px 0;
}
.music-btn {
    background-color: #facc15;
    color: black;
    padding: 10px 15px;
    border-radius: 10px;
}

/* --- Celebration --- */
.celebration h2 {
    font-size: 2.5rem;
    margin-top: 20px;
}
.celebration-text {
    font-size: 1.5rem;
    margin: 5px 0;
}

/* --- NO Button Absolute --- */
#noBtn1, #noBtn3 {
    position: absolute;
}
#yesBtn1, #yesBtn3 {
    position: relative;
    z-index: 10;
}
</style>
</head>

<body>

<!-- Background Music -->
<audio id="bgMusic" loop autoplay>
    <source src="./music/love.mp3" type="audio/mpeg">
</audio>

<div class="container">
    <h1 id="valentineTitle">Navroop, will you be my Valentine? 💖</h1>

    <!-- First Question -->
    <div class="question-section" id="question1">
        
        <button class="cute-btn" id="yesBtn1">Yes 💖</button>
        <button class="cute-btn" id="noBtn1">No 😢</button>
    </div>

    <!-- Second Question (Love Meter) -->
    <div class="question-section hidden" id="question2">
        <h2 id="question2Text">How much do you love me? 💞</h2>
        <input type="range" min="0" max="10000" value="100" class="slider" id="loveMeter">
        <p><span id="loveValue">100</span>% ❤️</p>
        <button class="cute-btn" id="nextBtn">Next ➡️</button>
    </div>

    <!-- Final Question -->
    <div class="question-section hidden" id="question3">
        <h2 id="question3Text">Will you be my Valentine forever? 💘</h2>
        <button class="cute-btn final-yes" id="yesBtn3">Yes 💞</button>
        <button class="cute-btn" id="noBtn3">No 😭</button>
    </div>

    <!-- Celebration -->
    <div class="celebration hidden" id="celebration">
        <h2 id="celebrationTitle">Yayyy!! 🥰</h2>
        <p class="celebration-text">Navroop ❤️ Kunwarjot</p>
        <p class="celebration-text">🎉💖🥹🌹</p>
    </div>
</div>

<script>
// --- Music Control ---
const bgMusic = document.getElementById('bgMusic');
bgMusic.volume = 0.3;

// --- Button references ---
const yesBtn1 = document.getElementById('yesBtn1');
const noBtn1 = document.getElementById('noBtn1');
const yesBtn3 = document.getElementById('yesBtn3');
const noBtn3 = document.getElementById('noBtn3');

const question1 = document.getElementById('question1');
const question2 = document.getElementById('question2');
const question3 = document.getElementById('question3');
const celebration = document.getElementById('celebration');
const loveMeter = document.getElementById('loveMeter');
const loveValue = document.getElementById('loveValue');
const nextBtn = document.getElementById('nextBtn');

// --- NO Button movement ---
function moveButton(btn) {
    const yesBtn = btn.id.includes('1') ? yesBtn1 : yesBtn3;
    const rectYes = yesBtn.getBoundingClientRect();
    let x, y;
    do {
        x = Math.random() * (window.innerWidth - 100);
        y = Math.random() * (window.innerHeight - 50);
    } while (
        x > rectYes.left - 50 && x < rectYes.right + 50 &&
        y > rectYes.top - 50 && y < rectYes.bottom + 50
    );
    btn.style.left = `${x}px`;
    btn.style.top = `${y}px`;
}

// --- First YES button ---
yesBtn1.addEventListener('click', () => {
    question1.classList.add('hidden');
    question2.classList.remove('hidden');
});

// --- Love Meter ---
loveMeter.addEventListener('input', () => {
    loveValue.textContent = loveMeter.value;
});

// --- Next button ---
nextBtn.addEventListener('click', () => {
    question2.classList.add('hidden');
    question3.classList.remove('hidden');
});

// --- Final YES button ---
yesBtn3.addEventListener('click', () => {
    question3.classList.add('hidden');
    celebration.classList.remove('hidden');
    confetti({
        particleCount: 250,
        spread: 90,
        origin: { y: 0.6 }
    });
});
</script>

</body>
</html>
